<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>Habit Tracker</title>
</head>
<body>
    
    <main class="auth-container">

        <header class="auth-header">

            <h1>Habit Tracker</h1>
            <p>Construa consistência, um dia de cada vez.</p>

        </header>

        <!-- Formulario de Login -->
        <section id="secao-login" class="auth-card">

            <h2>Entrar na conta</h2>

            <form id="form-login">

                <div class="form-group">

                    <label for="Login-email">E-mail</label>
                    <input type="email" id="login-email" placeholder="seu@email.com" required>

                </div>

                <div class="form-group">

                    <label for="Login-senha">Senha</label>
                    <input type="password" id="login-senha" placeholder="**********" required>

                </div>

                <button type="submit" class="btn-primary">Entrar</button>

            </form>

            <p class="auth-switch">
                Ainda não tem conta? <button type="button" id="btn-cadastro"></button>
            </p>

        </section>

        <!-- Formulario de Cadastro(Oculto Inicialmente) -->

        <section id="secao-cadastro" class="auth-card" hidden>

            <h2>Criar nova conta</h2>

            <form id="form-cadastro">

                <div class="form-group">

                    <label for="cadastro-nome">Nome completo</label>
                    <input type="text" id="cadastro-nome" placeholder="Ex: João da Silva" required>

                </div>

                <div class="form-group">

                    <label for="cadastro-email">E-mail</label>
                    <input type="email" id="cadastro-email" placeholder="seu@email.com" required>

                </div>

                <div class="form-group">

                    <label for="cadastro-senha">Senha</label>
                    <input type="password" id="cadastro-senha" placeholder="Minimo 8 caracteres" minlength="8" required>

                </div>

                <button type="submit" class="btn-primary">Criar Conta</button>
                
            </form>
        </section>

    </main>

</body>
</html>
